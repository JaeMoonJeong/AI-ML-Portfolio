# 미션 15 - 연구자 2: Docker Compose 설정
# ==========================================
#
# 사용법:
#   1. 연구자 1의 이미지가 Docker Hub에 푸시되어 있어야 함
#      또는 로컬에서 빌드: docker build -t mission15-researcher1 ../researcher1/
#
#   2. 실행:
#      docker-compose up
#
#   3. 브라우저에서 접속:
#      http://localhost:8888
#
# 참고:
#   - model.pkl은 volumes를 통해 마운트
#   - test.csv도 volumes를 통해 마운트
#   - result.csv는 outputs 폴더에 생성됨

version: '3.8'

services:
  # 연구자 1의 환경 (추론용으로 재사용)
  inference:
    # 옵션 1: Docker Hub에서 이미지 가져오기 (연구자 1이 푸시한 경우)
    # image: your-dockerhub-username/mission15-researcher1:latest

    # 옵션 2: 로컬에서 연구자 1의 Dockerfile 빌드
    build:
      context: ../researcher1
      dockerfile: Dockerfile

    container_name: mission15-inference

    ports:
      - "8888:8888"

    volumes:
      # 추론 노트북 마운트
      - ./inference.ipynb:/app/inference.ipynb
      # 테스트 데이터 마운트
      - ./data/test.csv:/app/data/test.csv
      # 모델 파일 마운트 (연구자 1이 생성한 model.pkl)
      # docker cp 또는 볼륨 공유를 통해 model.pkl을 가져와야 함
      - ./model.pkl:/app/model.pkl
      # 결과 출력 폴더
      - ./outputs:/app/outputs

    environment:
      - PYTHONUNBUFFERED=1

    # Jupyter Notebook 실행
    command: >
      jupyter notebook
      --ip=0.0.0.0
      --port=8888
      --no-browser
      --allow-root
      --NotebookApp.token=''
      --NotebookApp.password=''

  # 선택적: 추론만 실행하고 싶을 때 (노트북 없이)
  inference-batch:
    build:
      context: ../researcher1
      dockerfile: Dockerfile

    container_name: mission15-inference-batch

    volumes:
      - ./inference.py:/app/inference.py
      - ./data/test.csv:/app/data/test.csv
      - ./model.pkl:/app/model.pkl
      - ./outputs:/app/outputs

    profiles:
      - batch # docker-compose --profile batch up inference-batch